# Local development. PostgreSQL is published on 5434 so the host Prisma CLI can connect.
# Do not use this file for production — see docker-compose.prod.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: weepark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weepark
      POSTGRES_PASSWORD: weepark
      POSTGRES_DB: weepark
    ports:
      - '5434:5432'
    volumes:
      - weepark_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weepark -d weepark']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: weepark-backend-qr
    restart: unless-stopped
    profiles: ['full']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://weepark:weepark@postgres:5432/weepark?schema=public
      CLIENT_URL: http://localhost:8080
      API_URL: http://localhost:4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET (32+ chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET (32+ chars, different from access)}
      ENFORCE_HTTPS: 'false'
    ports:
      - '4000:4000'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: weepark-frontend
    restart: unless-stopped
    profiles: ['full']
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  weepark_pgdata:
